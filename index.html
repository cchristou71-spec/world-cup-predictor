const supa = {
  async get(table, filters="") {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}?${filters}`, {
      headers: { "apikey": SUPA_KEY, "Authorization": `Bearer ${SUPA_KEY}` }
    });
    if (!res.ok) throw new Error(`Supabase GET failed: ${res.status}`);
    return res.json();
  },
  async upsert(table, data) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method: "POST",
      headers: {
        "apikey": SUPA_KEY, "Authorization": `Bearer ${SUPA_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(`Supabase UPSERT failed: ${res.status}`);
    return true;
  },
  async getState(key) {
    const rows = await this.get("game_state", `select=value&key=eq.${KP}${key}`);
    return rows.length ? rows[0].value : null;
  },
  async setState(key, value) {
    return this.upsert("game_state", { key: `${KP}${key}`, value, updated_at: new Date().toISOString() });
  },
};

// BRACKET STRUCTURE — round order + auto-advancement wiring
// Each match in r16/qf/sf/f has homeFrom/awayFrom pointing at the
// previous round's match id + W (winner). Round of 32 starts with
// placeholder team names the admin fills in once qualifiers confirmed.
// ══════════════════════════════════════════════════════════════════
const ROUND_ORDER = ["r32","r16","qf","sf","f"];
const ROUND_LABELS = { r32:"Round of 32", r16:"Round of 16", qf:"Quarter-Finals", sf:"Semi-Finals", f:"Final" };
const ROUND_DATES = {
  r32: "28 Jun – 3 Jul", r16: "4–7 Jul", qf: "9–11 Jul", sf: "14–15 Jul", f: "18–19 Jul"
};
// Exact-score points scale up each round; correct result (right outcome, wrong score) is always 1pt flat.
const ROUND_POINTS = { r32: 3, r16: 4, qf: 5, sf: 6, f: 7 };
// Advisory "predict by" deadlines — shown to players, but rounds are still locked manually by admin.
const PREDICT_BY = {
  r32: "Sat 28 Jun", r16: "Sat 4 Jul", qf: "Wed 8 Jul", sf: "Mon 13 Jul", f: "Fri 17 Jul"

function buildInitialBracket() {

    { home:"Runner-up Group A", away:"Runner-up Group B", date:"2026-06-28", time:"20:00", venue:"Los Angeles, USA" },
    { home:"Winner Group E",    away:"3rd Group A/B/C/D/F", date:"2026-06-29", time:"21:30", venue:"Foxborough, USA" },

    { home:"Winner Group L",    away:"3rd Group E/H/I/J/K", date:"2026-07-01", time:"17:00", venue:"Atlanta, USA" },
    { home:"Winner Group D",    away:"3rd Group B/E/F/I/J", date:"2026-07-01", time:"20:00", venue:"Vancouver, Canada" },
    { home:"Winner Group G",    away:"3rd Group A/E/H/I/J", date:"2026-07-01", time:"21:00", venue:"Seattle, USA" },
    { home:"Runner-up Group K", away:"Runner-up Group L", date:"2026-07-02", time:"02:30", venue:"Kansas City, USA" },
    { home:"Winner Group H",    away:"Runner-up Group J", date:"2026-07-02", time:"18:00", venue:"Toronto, Canada" },
    { home:"Winner Group B",    away:"3rd Group E/F/G/I/J", date:"2026-07-02", time:"21:00", venue:"San Francisco, USA" },

// Given a match's homeGoals/awayGoals (90-min only, no ET/pens here),
// the admin records the actual winner separately if it went to extra time/pens.
// True if a team slot still holds a bracket descriptor (e.g. "Winner Group A",
// "Runner-up Group B", "3rd Group C/D/F/G/H") rather than a confirmed team name.
function isPlaceholderTeam(name) {
  return !name || name === "TBC" || name.startsWith("Winner ") || name.startsWith("Runner") || name.includes("3rd");
}

function matchWinner(m) {
  if (!m.result) return null;
  if (m.result.winner) return m.result.winner; // explicit winner (covers ET/pens draws)
  if (m.result.homeGoals > m.result.awayGoals) return m.home;
  if (m.result.awayGoals > m.result.homeGoals) return m.away;
  return null; // genuinely unresolved (shouldn't happen in knockout)
}

// After results are entered, propagate winners into the next round's slots
function propagateBracket(bracket) {
  const b = JSON.parse(JSON.stringify(bracket));
  ROUND_ORDER.forEach((rnd, idx) => {
    if (idx === 0) return;
    const prevRound = ROUND_ORDER[idx-1];
    const prevMatches = b[prevRound];
    b[rnd].forEach(m => {
      if (m.homeFrom) {
        const src = prevMatches.find(x => x.id === m.homeFrom);
        const w = src ? matchWinner(src) : null;
        if (w) m.home = w;
      }
      if (m.awayFrom) {
        const src = prevMatches.find(x => x.id === m.awayFrom);
        const w = src ? matchWinner(src) : null;
        if (w) m.away = w;
      }
    });
  });
  return b;
}

function scorePrediction(pred, result, round) {
  if (!pred || !result || result.homeGoals==null || result.awayGoals==null) return 0;
  if (pred.homeGoals==null || pred.awayGoals==null) return 0;
  const exactPts = ROUND_POINTS[round] || 3;
  if (pred.homeGoals===result.homeGoals && pred.awayGoals===result.awayGoals) return exactPts;
  const predOutcome = Math.sign(pred.homeGoals - pred.awayGoals); // -1, 0, 1
  const resOutcome = Math.sign(result.homeGoals - result.awayGoals);
  if (predOutcome === resOutcome) return 1; // correct result, flat 1pt regardless of round
  return 0;
}

          supa.getState("entry_fees").catch(()=>null),
        ]);
        if (b) setBracket(b); else await supa.setState("bracket", buildInitialBracket()).catch(()=>{});
        if (preds) setPredictions(preds);
        if (rv) setReveals(rv);
        if (p) setPins(p);
        if (pc && pc.players?.length) { setPlayers(pc.players); if(pc.colours) Object.assign(PLAYER_COLOURS, pc.colours); }
        if (lbl) setTournamentLabel(lbl);
        if (ef) setEntryFees(ef);
      } catch(e) { console.log("Initial load failed:", e.message); }
      setLoading(false);
    })();
  }, []);

  const saveBracket = async (newBracket) => {
    const propagated = propagateBracket(newBracket);
    setBracket(propagated);
    await supa.setState("bracket", propagated).catch(e=>toast_("Save failed: "+e.message,"error"));
  };

  const savePredictions = async (newPreds) => {
    setPredictions(newPreds);
    await supa.setState("predictions", newPreds).catch(e=>toast_("Save failed: "+e.message,"error"));
  };

  const loginAs = (name) => { setMe(name); try{localStorage.setItem("wc26_me",name);}catch{} };
  const logout = () => { setMe(null); try{localStorage.removeItem("wc26_me");}catch{} };

  if (loading) {
    return (
      <div style={{...S.page, display:"flex", alignItems:"center", justifyContent:"center"}}>
        <div style={{textAlign:"center"}}>
          <div style={{marginBottom:14, display:"flex", justifyContent:"center", animation:"pulseGold 1.4s ease-in-out infinite"}}><BallMark size={48}/></div>
          <div style={{color:C.chalkDim, fontSize:13, fontFamily:"'JetBrains Mono',monospace"}}>Loading bracket…</div>
        </div>
      </div>
    );
  }

  return (
    <div style={S.page}>
      <Toast msg={toast?.msg} type={toast?.type}/>
      <div style={S.header}>
        <BallMark size={38}/>
        <div>
          <div style={S.logo}>WORLD CUP<br/><span style={S.logoAccent}>KNOCKOUT</span> PREDICTOR</div>
          <div style={S.sub}>{tournamentLabel} · Round of 32 → Final</div>
        </div>
      </div>

      <div style={{padding:"14px 14px 0"}}>
        {!me ? (
          <LoginScreen players={players} pins={pins} onLogin={loginAs} toast_={toast_}/>
        ) : (
          <>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
              <div style={{display:"flex", alignItems:"center", gap:8}}>
                <div style={{width:10,height:10,borderRadius:"50%",background:playerColour(me)}}/>
                <span style={{color:playerColour(me), fontWeight:800, fontSize:15}}>{me}</span>
              </div>
              <button onClick={logout} style={S.btnGhost}>Switch player</button>
            </div>

            {tab==="predict" && <PredictTab bracket={bracket} predictions={predictions} savePredictions={savePredictions} reveals={reveals} me={me} toast_={toast_}/>}
            {tab==="bracket" && <BracketTab bracket={bracket}/>}
            {tab==="results" && <ResultsTab bracket={bracket} predictions={predictions} reveals={reveals} players={players}/>}
            {tab==="progress" && <ProgressTab bracket={bracket} predictions={predictions} reveals={reveals} players={players} entryFees={entryFees} ENTRY_FEE={ENTRY_FEE}/>}
            {tab==="admin" && <AdminTab bracket={bracket} saveBracket={saveBracket} reveals={reveals} setReveals={setReveals}
              players={players} setPlayers={setPlayers} pins={pins} setPins={setPins} admin={admin} setAdmin={setAdmin}
              toast_={toast_} tournamentLabel={tournamentLabel} setTournamentLabel={setTournamentLabel} predictions={predictions} setPredictions={setPredictions}
              entryFees={entryFees} setEntryFees={setEntryFees} ENTRY_FEE={ENTRY_FEE}/>}
          </>
        )}
      </div>

      {me && (
        <div style={S.tabBar}>
          {[["predict","🎯","Predict"],["bracket","🏆","Bracket"],["results","📊","Results"],["progress","📈","Progress"],["admin","⚙️","Admin"]].map(([id,icon,label])=>(
            <div key={id} onClick={()=>setTab(id)} style={{...S.tab, background: tab===id?C.goldDim:"transparent", color: tab===id?C.blue:C.chalkDim}}>
              <div style={{fontSize:17}}>{icon}</div>
              <div>{label}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}



// ══════════════════════════════════════════════════════════════════
// PREDICT TAB
// ══════════════════════════════════════════════════════════════════
function PredictTab({bracket, predictions, savePredictions, reveals, me, toast_}) {
  const [activeRound, setActiveRound] = useState(()=>{
    for (const r of ROUND_ORDER) { if (!reveals[r]) return r; }
    return "f";
  });

  const matches = bracket[activeRound] || [];
  const myPreds = predictions[me] || {};
  const isLocked = !!reveals[activeRound];

  const updatePred = (matchId, field, val) => {
    if (isLocked) return;
    const v = val === "" ? null : Math.max(0, Math.min(20, parseInt(val)||0));
    const np = { ...predictions, [me]: { ...myPreds, [matchId]: { ...(myPreds[matchId]||{}), [field]: v } } };
    savePredictions(np);
  };

  const filledCount = matches.filter(m => {
    const p = myPreds[m.id];
    return p && p.homeGoals!=null && p.awayGoals!=null;
  }).length;
  const playableCount = matches.filter(m => !isPlaceholderTeam(m.home) && !isPlaceholderTeam(m.away)).length;

  return (
    <div className="fade-in">
      <div style={{display:"flex", gap:6, overflowX:"auto", marginBottom:14, paddingBottom:4}}>
        {ROUND_ORDER.map(r=>(
          <button key={r} onClick={()=>setActiveRound(r)}
            style={{flexShrink:0, padding:"8px 14px", borderRadius:20, fontSize:12, fontWeight:700, cursor:"pointer",
              background: activeRound===r ? C.blue : C.bgCard,
              color: activeRound===r ? "#fff" : (reveals[r] ? C.win : C.chalkDim),
              border:`1px solid ${activeRound===r ? C.blue : C.line}`}}>
            {ROUND_LABELS[r]} {reveals[r] ? "🔒" : ""}
          </button>
        ))}
      </div>

      <div style={{...S.card, padding:"12px 16px", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <div>
          <div style={{fontSize:14, fontWeight:700, color:C.chalk}}>{ROUND_LABELS[activeRound]}</div>
          <div style={{fontSize:11, color:C.chalkDim, marginTop:2}}>{ROUND_DATES[activeRound]}</div>
          <div style={{fontSize:11, color:C.blueSoft, marginTop:4, fontWeight:600}}>
            🎯 {ROUND_POINTS[activeRound]}pts exact · 1pt correct result
          </div>
          {!isLocked && (
            <div style={{fontSize:10, color:C.chalkFaint, marginTop:3}}>
              Predict by {PREDICT_BY[activeRound]} (advisory — admin locks manually)
            </div>
          )}
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:18, fontWeight:800, color: filledCount===playableCount && playableCount>0 ? C.win : C.gold}}>
            {filledCount}/{playableCount||"–"}
          </div>
          <div style={{fontSize:10, color:C.chalkDim}}>predicted</div>
        </div>
      </div>

      {isLocked && (
        <div style={{background:C.winSoft, border:`1px solid ${C.win}`, borderRadius:10, padding:"10px 14px", marginBottom:12, fontSize:12, color:C.win, textAlign:"center", fontWeight:600}}>
          🔒 {ROUND_LABELS[activeRound]} is locked — predictions revealed
        </div>
      )}

      {matches.length===0 && (
        <div style={{textAlign:"center", padding:"30px 0", color:C.chalkFaint}}>No matches in this round yet</div>
      )}

      {matches.map(m=>{
        const tbc = isPlaceholderTeam(m.home) || isPlaceholderTeam(m.away);
        const pred = myPreds[m.id] || {};
        return (
          <div key={m.id} style={{...S.card, opacity: tbc ? 0.5 : 1}}>
            {m.date && <div style={{fontSize:10, color:C.chalkFaint, marginBottom:8, fontFamily:"'JetBrains Mono',monospace"}}>
              {m.date} {m.time && `· ${m.time}`} {m.venue && `· ${m.venue}`}
            </div>}
            <div style={{display:"flex", alignItems:"center", gap:10}}>
              <div style={{flex:1}}><TeamRow name={m.home}/></div>
              <input type="number" min={0} max={20} value={pred.homeGoals ?? ""} disabled={tbc||isLocked}
                onChange={e=>updatePred(m.id,"homeGoals",e.target.value)}
                style={{...S.gi, opacity:(tbc||isLocked)?0.4:1}} placeholder="–"/>
              <span style={{color:C.chalkFaint, fontWeight:700}}>–</span>
              <input type="number" min={0} max={20} value={pred.awayGoals ?? ""} disabled={tbc||isLocked}
                onChange={e=>updatePred(m.id,"awayGoals",e.target.value)}
                style={{...S.gi, opacity:(tbc||isLocked)?0.4:1}} placeholder="–"/>
              <div style={{flex:1, textAlign:"right"}}><TeamRow name={m.away}/></div>
            </div>
            {tbc && <div style={{fontSize:10, color:C.chalkFaint, marginTop:8, textAlign:"center", fontStyle:"italic"}}>Matchup not yet confirmed</div>}
          </div>
        );
      })}
    </div>
  );
}

// BRACKET TAB — the signature visual: a tournament tree with a
// gold connector line tracing the path to the final.
// ══════════════════════════════════════════════════════════════════
function BracketMatchCard({m, compact}) {
  const winner = matchWinner(m);
  const hasResult = !!m.result;
  return (
    <div style={{background:C.bgCard, border:`1px solid ${C.line}`, borderRadius:10,
      padding: compact ? "8px 10px" : "10px 12px", minWidth: compact ? 150 : 180}}>
      {[["home",m.home],["away",m.away]].map(([side,name])=>{
        const isWinner = hasResult && winner === name;
        const score = hasResult ? (side==="home"?m.result.homeGoals:m.result.awayGoals) : null;
        return (
          <div key={side} style={{display:"flex", justifyContent:"space-between", alignItems:"center",
            padding:"4px 0", opacity: hasResult && !isWinner ? 0.45 : 1}}>
            <TeamRow name={name} size={compact?12:13} bold={isWinner}/>
            {hasResult && <span style={{fontFamily:"'JetBrains Mono',monospace", fontWeight:800, color: isWinner?C.gold:C.chalkDim, fontSize:compact?13:14}}>{score}</span>}
          </div>
        );
      })}
    </div>
  );
}

function BracketTab({bracket}) {
  return (
    <div className="fade-in" style={{overflowX:"auto", paddingBottom:10}}>
      <div style={{display:"flex", gap:0, minWidth:920, padding:"4px 2px"}}>
        {ROUND_ORDER.map((rnd, ridx) => (
          <div key={rnd} style={{flex:1, display:"flex", flexDirection:"column", justifyContent:"space-around", paddingRight: ridx<4?18:0}}>
            <div style={{textAlign:"center", marginBottom:14}}>
              <div style={{fontSize:11, fontWeight:800, color:C.gold, textTransform:"uppercase", letterSpacing:0.8}}>{ROUND_LABELS[rnd]}</div>
              <div style={{fontSize:9, color:C.chalkFaint, marginTop:2}}>{ROUND_DATES[rnd]}</div>
            </div>
            <div style={{display:"flex", flexDirection:"column", gap: rnd==="r32"?14 : rnd==="r16"?34 : rnd==="qf"?86 : rnd==="sf"?190:0,
              flex:1, justifyContent:"center"}}>
              {bracket[rnd].map(m=>(
                <div key={m.id} style={{position:"relative"}}>
                  <BracketMatchCard m={m} compact={rnd==="r32"}/>

            </div>

        ))}

      <div style={{textAlign:"center", marginTop:18, padding:"14px 0"}}>
        <div style={{fontSize:11, color:C.chalkFaint}}>🏆 Champion</div>
        <div style={{fontSize:20, fontWeight:800, color:C.gold, marginTop:4}}>
          {matchWinner(bracket.f[0]) ? <TeamRow name={matchWinner(bracket.f[0])} size={20}/> : "TBD"}
        </div>

}

  });
  const matches = bracket[activeRound] || [];
  const isRevealed = !!reveals[activeRound];

  return (
    <div className="fade-in">
      <div style={{display:"flex", gap:6, overflowX:"auto", marginBottom:14, paddingBottom:4}}>
        {ROUND_ORDER.map(r=>(
          <button key={r} onClick={()=>setActiveRound(r)}
            style={{flexShrink:0, padding:"8px 14px", borderRadius:20, fontSize:12, fontWeight:700, cursor:"pointer",
              background: activeRound===r ? C.blue : C.bgCard,
              color: activeRound===r ? "#fff" : (reveals[r] ? C.win : C.chalkDim),
              border:`1px solid ${activeRound===r ? C.blue : C.line}`}}>
            {ROUND_LABELS[r]}
          </button>
        ))}
      </div>

      {!isRevealed ? (
        <div style={{...S.card, textAlign:"center", padding:"40px 20px"}}>
          <div style={{fontSize:32, marginBottom:10}}>🔒</div>
          <div style={{color:C.chalkDim, fontSize:13}}>{ROUND_LABELS[activeRound]} predictions haven't been revealed yet.</div>
        </div>
      ) : matches.filter(m=>!isPlaceholderTeam(m.home)).length===0 ? (
        <div style={{...S.card, textAlign:"center", padding:"40px 20px", color:C.chalkFaint}}>No confirmed matches in this round yet.</div>
      ) : (
        matches.filter(m=>!isPlaceholderTeam(m.home)).map(m=>(
          <div key={m.id} style={S.card}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
              <TeamRow name={m.home} size={14}/>
              {m.result ? (
                <span style={{fontFamily:"'JetBrains Mono',monospace", fontWeight:800, color:C.gold, fontSize:16}}>
                  {m.result.homeGoals} – {m.result.awayGoals}
                </span>
              ) : <span style={{color:C.chalkFaint, fontSize:12}}>vs</span>}
              <TeamRow name={m.away} size={14}/>
            </div>
            <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
              {players.map(p=>{
                const pred = (predictions[p]||{})[m.id];
                const pts = m.result ? scorePrediction(pred, m.result, activeRound) : null;
                return (
                  <div key={p} style={{display:"flex", alignItems:"center", gap:6, background:C.bgInput,
                    border:`1px solid ${C.lineSoft}`, borderRadius:8, padding:"5px 10px"}}>
                    <span style={{width:7,height:7,borderRadius:"50%",background:playerColour(p)}}/>
                    <span style={{fontSize:11, color:playerColour(p), fontWeight:700}}>{p}</span>
                    <span style={{fontSize:12, color:C.chalk, fontFamily:"'JetBrains Mono',monospace"}}>
                      {pred && pred.homeGoals!=null ? `${pred.homeGoals}-${pred.awayGoals}` : "—"}
                    </span>
                    {pts!==null && <span style={{fontSize:11, fontWeight:800, color: pts===3?C.gold:pts===1?C.win:C.chalkFaint}}>+{pts}</span>}
                  </div>
                );
              })}
            </div>
          </div>
        ))
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// PROGRESS TAB — leaderboard across all revealed rounds
// ══════════════════════════════════════════════════════════════════
function ProgressTab({bracket, predictions, reveals, players, entryFees, ENTRY_FEE}) {
  const standings = useMemo(() => {
    return players.map(p => {
      let pts = 0, exact = 0, correct = 0, played = 0;
      ROUND_ORDER.forEach(rnd => {
        if (!reveals[rnd]) return;
        (bracket[rnd]||[]).forEach(m => {
          if (!m.result) return;
          const pred = (predictions[p]||{})[m.id];
          if (!pred || pred.homeGoals==null) return;
          played++;
          const s = scorePrediction(pred, m.result, rnd);
          pts += s;
          if (s === ROUND_POINTS[rnd]) exact++; else if (s===1) correct++;
        });
      });
      return { p, pts, exact, correct, played };
    }).sort((a,b)=>b.pts-a.pts);
  }, [bracket, predictions, reveals, players]);

  const medals = ["🥇","🥈","🥉"];
  const paidCount = entryFees ? players.filter(p => (entryFees[p]||{}).paid === "Y").length : 0;
  const pot = paidCount * (ENTRY_FEE||0);

  return (
    <div className="fade-in">
      <div style={{...S.card, padding:"14px 16px", marginBottom:16}}>
        <div style={S.ct}>🏆 Leaderboard</div>
        <div style={{fontSize:11, color:C.chalkDim, marginTop:4}}>
          {ROUND_ORDER.filter(r=>reveals[r]).length}/5 rounds revealed · Correct result = 1pt always
        </div>
        {ENTRY_FEE>0 && (
          <div style={{marginTop:10, paddingTop:10, borderTop:`1px solid ${C.lineSoft}`, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <span style={{fontSize:11, color:C.chalkDim, fontWeight:600}}>PRIZE POT · WINNER TAKES ALL</span>
            <span style={{fontSize:18, fontWeight:800, color:C.chalk, fontFamily:"'Archivo Black',sans-serif"}}>£{pot}</span>
          </div>
        )}
      </div>

      <div style={{...S.card, marginBottom:16}}>
        <div style={S.ct}>📐 Scoring by Round</div>
        <table style={{width:"100%", marginTop:10, fontSize:12, borderCollapse:"collapse"}}>
          <thead>
            <tr style={{borderBottom:`1px solid ${C.line}`}}>
              <th style={{textAlign:"left", padding:"4px 6px", color:C.chalkDim, fontWeight:600}}>Round</th>
              <th style={{textAlign:"center", padding:"4px 6px", color:C.chalkDim, fontWeight:600}}>Exact score</th>
              <th style={{textAlign:"center", padding:"4px 6px", color:C.chalkDim, fontWeight:600}}>Predict by</th>
            </tr>
          </thead>
          <tbody>
            {ROUND_ORDER.map(r=>(
              <tr key={r} style={{borderBottom:`1px solid ${C.lineSoft}`}}>
                <td style={{padding:"6px 6px", color:C.chalk, fontWeight:600}}>{ROUND_LABELS[r]}</td>
                <td style={{padding:"6px 6px", textAlign:"center", color:C.blue, fontWeight:800}}>{ROUND_POINTS[r]}pts</td>
                <td style={{padding:"6px 6px", textAlign:"center", color:C.chalkDim, fontFamily:"'JetBrains Mono',monospace", fontSize:11}}>{PREDICT_BY[r]}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {standings.map((r,i)=>(
        <div key={r.p} className="fade-in" style={{...S.card, display:"flex", alignItems:"center", gap:12,
          border: i===0 ? `1px solid ${C.gold}` : `1px solid ${C.line}`,
          background: i===0 ? `linear-gradient(135deg, ${C.goldDim} 0%, #fff 100%)` : C.bgCard}}>
          <div style={{fontSize:22, width:34, textAlign:"center"}}>{medals[i] || `#${i+1}`}</div>
          <div style={{flex:1}}>
            <div style={{color:playerColour(r.p), fontWeight:800, fontSize:16}}>{r.p}</div>
            <div style={{color:C.chalkDim, fontSize:11, marginTop:2}}>
              🎯 {r.exact} exact · ✓ {r.correct} correct · {r.played} played
            </div>
          </div>
          <div style={{fontSize:26, fontWeight:800, color: i===0?C.gold:C.chalk, fontFamily:"'Archivo Black',sans-serif"}}>{r.pts}</div>
        </div>
      ))}
    </div>
  );
}

function AdminTab({bracket, saveBracket, reveals, setReveals, players, setPlayers, pins, setPins,
  admin, setAdmin, toast_, tournamentLabel, setTournamentLabel, predictions, setPredictions,
  entryFees, setEntryFees, ENTRY_FEE}) {

  const [pw, setPw] = useState("");
  const doUnlock = () => {
    const stored = (()=>{try{return JSON.parse(localStorage.getItem("wc26_admin_pws")||'["admin123"]');}catch{return ["admin123"];}})();
    if (stored.includes(pw)) { setAdmin(true); toast_("Admin unlocked"); }
    else toast_("Wrong password","error");
  };

  if (!admin) return (
    <div style={{...S.card, border:`2px solid ${C.gold}`, padding:24, textAlign:"center"}}>
      <div style={{fontSize:36, marginBottom:8}}>⚙️</div>
      <div style={{fontSize:18, fontWeight:800, color:C.chalk, marginBottom:14}}>Admin Access</div>
      <input type="password" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter")doUnlock();}}
        style={{...S.inp, textAlign:"center", letterSpacing:3}}/>
      <button onClick={doUnlock} style={{...S.btn, width:"100%"}}>Unlock</button>
      <div style={{fontSize:11, color:C.chalkFaint, marginTop:10}}>Default password: admin123</div>
    </div>

  return (
    <div className="fade-in">
      <div style={{display:"flex", justifyContent:"space-between", marginBottom:14}}>
        <div style={{fontWeight:800, fontSize:16, color:C.chalk}}>⚙️ Admin Panel</div>
        <button onClick={()=>setAdmin(false)} style={S.btnGhost}>Lock</button>
      </div>

      <AdminGroup title="🏆 Tournament Setup" defaultOpen={true}>
        <TournamentLabelEditor label={tournamentLabel} setLabel={setTournamentLabel} toast_={toast_}/>
        <PlayerManagerWC players={players} setPlayers={setPlayers} pins={pins} setPins={setPins} toast_={toast_}/>
      </AdminGroup>

      <AdminGroup title="📋 Bracket & Results" defaultOpen={true}>
        <BracketEditor bracket={bracket} saveBracket={saveBracket} toast_={toast_}/>
      </AdminGroup>

      <AdminGroup title="🔒 Reveal Rounds" defaultOpen={false}>
        <RevealPanel reveals={reveals} setReveals={setReveals} toast_={toast_}/>
      </AdminGroup>

      <AdminGroup title="💰 Entry Fee" defaultOpen={false}>
        <EntryFeePanel players={players} entryFees={entryFees} setEntryFees={setEntryFees} ENTRY_FEE={ENTRY_FEE} toast_={toast_}/>

      <AdminGroup title="🔄 Reset" defaultOpen={false}>
        <ResetPanel saveBracket={saveBracket} setReveals={setReveals} setPredictions={setPredictions} setEntryFees={setEntryFees} toast_={toast_}/>
      </AdminGroup>
    </div>
  );
}

function TournamentLabelEditor({label, setLabel, toast_}) {
  const [draft, setDraft] = useState(label);
  const [busy, setBusy] = useState(false);
  return (
    <div style={{...S.card, marginBottom:12}}>
      <div style={S.ct}>Tournament Label</div>
      <div style={{display:"flex", gap:8, marginTop:8}}>
        <input value={draft} onChange={e=>setDraft(e.target.value)} style={{...S.inp, marginBottom:0, flex:1}}/>
        <button disabled={busy||draft===label} onClick={async()=>{
          setBusy(true); await supa.setState("label",draft).catch(()=>{}); setLabel(draft); setBusy(false); toast_("✅ Updated");
        }} style={{...S.btn, opacity:(busy||draft===label)?0.4:1}}>Save</button>
      </div>
    </div>
  );
}

function PlayerManagerWC({players, setPlayers, pins, setPins, toast_}) {
  const PRESET = ["#60B8E8","#FDB913","#6699FF","#4ADE80","#FF6B6B","#E8557A","#CBD5E1","#A78BFA","#FB923C","#34D399"];
  const [editing, setEditing] = useState(null);
  const [name, setName] = useState(""); const [colour, setColour] = useState(PRESET[0]); const [pin, setPin] = useState("");

  const persist = async (np, pc) => {
    await supa.setState("pins", np).catch(()=>{});
    await supa.setState("player_config", pc).catch(()=>{});
  };

  const openAdd = () => { setName(""); setColour(PRESET[players.length%PRESET.length]); setPin(""); setEditing("new"); };
  const openEdit = (p) => { setName(p); setColour(playerColour(p)); setPin(pins[p]||""); setEditing(p); };

  const save = async () => {
    if (!name.trim() || pin.length!==4) return;
    const newPlayers = editing==="new" ? [...players, name.trim()] : players.map(p=>p===editing?name.trim():p);
    const newColours = {...PLAYER_COLOURS, [name.trim()]: colour};
    if (editing!=="new" && editing!==name.trim()) delete newColours[editing];
    const newPins = {...pins, [name.trim()]: pin};
    if (editing!=="new" && editing!==name.trim()) delete newPins[editing];
    setPlayers(newPlayers); setPins(newPins); Object.assign(PLAYER_COLOURS, newColours);
    await persist(newPins, {players:newPlayers, colours:newColours});
    toast_(`✅ Player ${editing==="new"?"added":"updated"}`); setEditing(null);
  };

  const del = async (p) => {
    const newPlayers = players.filter(x=>x!==p);
    const newPins = {...pins}; delete newPins[p];
    setPlayers(newPlayers); setPins(newPins);
    await persist(newPins, {players:newPlayers, colours:PLAYER_COLOURS});
    toast_(`🗑️ Removed ${p}`);
  };

  if (editing) return (
    <div style={S.card}>
      <div style={S.ct}>{editing==="new"?"Add Player":`Edit ${editing}`}</div>
      <input value={name} onChange={e=>setName(e.target.value)} placeholder="Name" style={S.inp}/>
      <div style={{display:"flex", gap:6, flexWrap:"wrap", marginBottom:10}}>
        {PRESET.map(c=>(<div key={c} onClick={()=>setColour(c)} style={{width:26,height:26,borderRadius:"50%",background:c,cursor:"pointer",border:colour===c?"2px solid #fff":"2px solid transparent"}}/>))}
      </div>
      <input value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,"").slice(0,4))} placeholder="4-digit PIN" maxLength={4}
        style={{...S.inp, fontFamily:"'JetBrains Mono',monospace", letterSpacing:6, textAlign:"center", fontSize:18}}/>
      <div style={{display:"flex", gap:8}}>
        <button onClick={()=>setEditing(null)} style={{...S.btnGhost, flex:1}}>Cancel</button>
        <button onClick={save} disabled={!name.trim()||pin.length!==4} style={{...S.btn, flex:2, opacity:(!name.trim()||pin.length!==4)?0.4:1}}>Save</button>
      </div>
    </div>
  );

  return (
    <div style={S.card}>
      <div style={{display:"flex", justifyContent:"space-between", marginBottom:10}}>
        <div style={S.ct}>Players ({players.length})</div>
        <button onClick={openAdd} style={{...S.btnGhost, color:C.win, borderColor:C.win}}>+ Add</button>
      </div>
      {players.map(p=>(
        <div key={p} style={{display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:`1px solid ${C.lineSoft}`}}>
          <div style={{width:9,height:9,borderRadius:"50%",background:playerColour(p)}}/>
          <span style={{flex:1, color:playerColour(p), fontWeight:700, fontSize:14}}>{p}</span>
          <span style={{fontSize:10, color:pins[p]?C.win:C.red}}>{pins[p]?"PIN ✓":"No PIN"}</span>
          <button onClick={()=>openEdit(p)} style={{...S.btnGhost, padding:"4px 10px", fontSize:11}}>Edit</button>
          <button onClick={()=>del(p)} style={{...S.btnGhost, padding:"4px 10px", fontSize:11, color:C.red, borderColor:C.red}}>✕</button>
        </div>
      ))}
    </div>
  );
}

function BracketEditor({bracket, saveBracket, toast_}) {
  const [activeRound, setActiveRound] = useState("r32");
  const matches = bracket[activeRound] || [];

  const updateTeam = (matchId, side, value) => {
    const nb = JSON.parse(JSON.stringify(bracket));
    const m = nb[activeRound].find(x=>x.id===matchId);
    m[side] = value;
    saveBracket(nb);
  };
  const updateMeta = (matchId, field, value) => {
    const nb = JSON.parse(JSON.stringify(bracket));
    const m = nb[activeRound].find(x=>x.id===matchId);
    m[field] = value;
    saveBracket(nb);
  };
  const updateResult = (matchId, field, value) => {
    const nb = JSON.parse(JSON.stringify(bracket));
    const m = nb[activeRound].find(x=>x.id===matchId);
    const v = value==="" ? null : parseInt(value);
    m.result = { ...(m.result||{}), [field]: v };
    saveBracket(nb);
    toast_(`✅ ${ROUND_LABELS[activeRound]} updated — next round auto-filled`);
  };
  const setWinnerOnDraw = (matchId, winnerTeam) => {
    const nb = JSON.parse(JSON.stringify(bracket));
    const m = nb[activeRound].find(x=>x.id===matchId);
    m.result = { ...(m.result||{}), winner: winnerTeam };
    saveBracket(nb);
    toast_(`✅ Winner set: ${winnerTeam} (after ET/pens)`);
  };

  return (
    <div>
      <div style={{display:"flex", gap:6, overflowX:"auto", marginBottom:14, paddingBottom:4}}>
        {ROUND_ORDER.map(r=>(
          <button key={r} onClick={()=>setActiveRound(r)}
            style={{flexShrink:0, padding:"7px 12px", borderRadius:18, fontSize:11, fontWeight:700, cursor:"pointer",
              background: activeRound===r ? C.blue : C.bgCard, color: activeRound===r ? "#fff" : C.chalkDim,
              border:`1px solid ${activeRound===r?C.blue:C.line}`}}>
            {ROUND_LABELS[r]}
          </button>
        ))}
      </div>

      {activeRound==="r32" && (
        <div style={{fontSize:11, color:C.chalkDim, marginBottom:10, lineHeight:1.6}}>
          Fill in confirmed Round of 32 matchups as FIFA announces them. Use full team names (e.g. "Brazil", "Switzerland") so flags and predictions match correctly.
        </div>
      )}
      {activeRound!=="r32" && (
        <div style={{fontSize:11, color:C.chalkDim, marginBottom:10, lineHeight:1.6}}>
          Teams auto-fill once the previous round's results are entered. Enter scores below as they're confirmed.
        </div>
      )}

      {matches.map(m=>{
        const tbc = isPlaceholderTeam(m.home) || isPlaceholderTeam(m.away);
        const draw = m.result && m.result.homeGoals!=null && m.result.awayGoals!=null && m.result.homeGoals===m.result.awayGoals;
        return (
          <div key={m.id} style={{...S.card, opacity: tbc && activeRound!=="r32" ? 0.5 : 1}}>
            <div style={{fontSize:11, color:C.chalkFaint, marginBottom:8}}>{m.id.toUpperCase()}</div>

            {activeRound==="r32" ? (
              <div style={{marginBottom:8}}>
                <div style={{display:"flex", gap:8, marginBottom:4}}>
                  <input value={isPlaceholderTeam(m.home)?"":m.home}
                    onChange={e=>updateTeam(m.id,"home",e.target.value||m.slotHome||"TBC")}
                    placeholder={m.slotHome||"Home team"} style={{...S.inp, marginBottom:0, flex:1}}/>
                  <input value={isPlaceholderTeam(m.away)?"":m.away}
                    onChange={e=>updateTeam(m.id,"away",e.target.value||m.slotAway||"TBC")}
                    placeholder={m.slotAway||"Away team"} style={{...S.inp, marginBottom:0, flex:1}}/>
                </div>
                <div style={{fontSize:10, color:C.chalkFaint, fontStyle:"italic"}}>
                  Bracket slot: {m.slotHome||"TBC"} vs {m.slotAway||"TBC"}
                </div>
              </div>
            ) : (
              <div style={{display:"flex", justifyContent:"space-between", marginBottom:8}}>
                <TeamRow name={m.home} size={14}/><span style={{color:C.chalkFaint}}>vs</span><TeamRow name={m.away} size={14}/>
              </div>
            )}

            <div style={{display:"flex", gap:8, marginBottom:8, flexWrap:"wrap"}}>
              <input type="date" value={m.date||""} onChange={e=>updateMeta(m.id,"date",e.target.value)}
                style={{...S.inp, marginBottom:0, width:140, fontSize:12, padding:"7px 8px"}}/>
              <input type="time" value={m.time||""} onChange={e=>updateMeta(m.id,"time",e.target.value)}
                style={{...S.inp, marginBottom:0, width:90, fontSize:12, padding:"7px 8px"}}/>
              <input value={m.venue||""} onChange={e=>updateMeta(m.id,"venue",e.target.value)} placeholder="Venue"
                style={{...S.inp, marginBottom:0, flex:1, minWidth:100, fontSize:12, padding:"7px 8px"}}/>
            </div>

            <div style={{display:"flex", gap:8, alignItems:"center"}}>
              <span style={{color:C.chalkDim, fontSize:12}}>90-min result:</span>
              <input type="number" min={0} max={20} value={m.result?.homeGoals ?? ""} disabled={tbc}
                onChange={e=>updateResult(m.id,"homeGoals",e.target.value)}
                style={{...S.gi, width:42, height:38, fontSize:15, opacity:tbc?0.4:1}}/>
              <span style={{color:C.chalkFaint}}>–</span>
              <input type="number" min={0} max={20} value={m.result?.awayGoals ?? ""} disabled={tbc}
                onChange={e=>updateResult(m.id,"awayGoals",e.target.value)}
                style={{...S.gi, width:42, height:38, fontSize:15, opacity:tbc?0.4:1}}/>
            </div>

            {draw && (
              <div style={{marginTop:8, padding:"8px 10px", background:C.goldDim, border:`1px solid ${C.gold}`, borderRadius:8}}>
                <div style={{fontSize:11, color:C.chalk, fontWeight:700, marginBottom:6}}>⚽ Drawn after 90 — who won on ET/penalties?</div>
                <div style={{display:"flex", gap:8}}>
                  <button onClick={()=>setWinnerOnDraw(m.id,m.home)}
                    style={{...S.btnGhost, flex:1, background: m.result.winner===m.home?C.win:"transparent", color: m.result.winner===m.home?"#fff":C.chalk}}>
                    {m.home}
                  </button>
                  <button onClick={()=>setWinnerOnDraw(m.id,m.away)}
                    style={{...S.btnGhost, flex:1, background: m.result.winner===m.away?C.win:"transparent", color: m.result.winner===m.away?"#fff":C.chalk}}>
                    {m.away}
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function RevealPanel({reveals, setReveals, toast_}) {
  const toggle = async (rnd) => {
    const nr = {...reveals, [rnd]: !reveals[rnd]};
    setReveals(nr);
    await supa.setState("reveals", nr).catch(()=>{});
    toast_(nr[rnd] ? `🔓 ${ROUND_LABELS[rnd]} revealed` : `🔒 ${ROUND_LABELS[rnd]} hidden again`);
  };
  return (
    <div>
      <p style={{fontSize:12, color:C.chalkDim, marginBottom:12}}>Reveal a round once its deadline passes — players will see everyone's predictions and it locks further changes.</p>
      {ROUND_ORDER.map(r=>(
        <div key={r} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderBottom:`1px solid ${C.lineSoft}`}}>
          <span style={{color:C.chalk, fontWeight:600, fontSize:14}}>{ROUND_LABELS[r]}</span>
          <button onClick={()=>toggle(r)} style={{...S.btnGhost,
            background: reveals[r]?C.winSoft:"transparent", color: reveals[r]?C.win:C.chalkDim,
            borderColor: reveals[r]?C.win:C.line}}>
            {reveals[r] ? "🔓 Revealed" : "🔒 Hidden"}
          </button>
        </div>
      ))}
    </div>
  );
}

function EntryFeePanel({players, entryFees, setEntryFees, ENTRY_FEE, toast_}) {
  const paidCount = players.filter(p => (entryFees[p]||{}).paid === "Y").length;
  const pot = paidCount * ENTRY_FEE;

  const update = async (p, field, value) => {
    const updated = { ...entryFees, [p]: { ...(entryFees[p]||{}), [field]: value } };
    setEntryFees(updated);
    await supa.setState("entry_fees", updated).catch(()=>{});
  };

  return (
    <div>
      <div style={{background:C.goldDim, border:`1px solid ${C.gold}`, borderRadius:10, padding:"12px 14px", marginBottom:14, textAlign:"center"}}>
        <div style={{fontSize:11, color:C.chalkDim, fontWeight:600}}>PRIZE POT · WINNER TAKES ALL</div>
        <div style={{fontSize:28, fontWeight:800, color:C.chalk, fontFamily:"'Archivo Black',sans-serif", marginTop:2}}>£{pot}</div>
        <div style={{fontSize:11, color:C.chalkDim, marginTop:2}}>{paidCount}/{players.length} paid · £{ENTRY_FEE} per person</div>
      </div>
      <table style={{width:"100%", borderCollapse:"collapse", fontSize:13}}>
        <thead>
          <tr style={{borderBottom:`1px solid ${C.line}`}}>
            <th style={{textAlign:"left", padding:"6px 6px", color:C.chalkDim, fontWeight:600}}>Player</th>
            <th style={{textAlign:"center", padding:"6px 6px", color:C.chalkDim, fontWeight:600}}>Paid</th>
            <th style={{textAlign:"center", padding:"6px 6px", color:C.chalkDim, fontWeight:600}}>Method</th>
            <th style={{textAlign:"left", padding:"6px 6px", color:C.chalkDim, fontWeight:600}}>Date</th>
          </tr>
        </thead>
        <tbody>
          {players.map(p => {
            const fee = entryFees[p] || {paid:"N", method:"", date:""};
            return (
              <tr key={p} style={{borderBottom:`1px solid ${C.lineSoft}`}}>
                <td style={{padding:"8px 6px", color:playerColour(p), fontWeight:700}}>{p}</td>
                <td style={{padding:"8px 6px", textAlign:"center"}}>
                  <button onClick={()=>update(p,"paid", fee.paid==="Y"?"N":"Y")}
                    style={{background: fee.paid==="Y"?C.winSoft:C.redSoft, color: fee.paid==="Y"?C.win:C.red,
                      border:"none", borderRadius:6, padding:"4px 12px", fontSize:12, fontWeight:700, cursor:"pointer"}}>
                    {fee.paid==="Y" ? "✓ Paid" : "✗ Unpaid"}
                  </button>
                </td>
                <td style={{padding:"8px 6px", textAlign:"center"}}>
                  <select value={fee.method||""} onChange={e=>update(p,"method",e.target.value)}
                    style={{...S.inp, marginBottom:0, padding:"4px 6px", fontSize:12, width:90}}>
                    <option value="">—</option>
                    <option value="Cash">Cash</option>
                    <option value="Transfer">Transfer</option>
                  </select>
                </td>
                <td style={{padding:"8px 6px"}}>
                  <input type="date" value={fee.date||""} onChange={e=>update(p,"date",e.target.value)}
                    style={{...S.inp, marginBottom:0, padding:"4px 6px", fontSize:12, width:130}}/>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <p style={{fontSize:11, color:C.chalkFaint, marginTop:10}}>Winner takes the full pot — no split for runners-up.</p>
    </div>
  );
}


function ResetPanel({saveBracket, setReveals, setPredictions, setEntryFees, toast_}) {
  const [confirm, setConfirm] = useState("");
  const [busy, setBusy] = useState(false);
  const doReset = async () => {
    setBusy(true);
    try {
      const fresh = buildInitialBracket();
      await saveBracket(fresh);
      setReveals({}); await supa.setState("reveals", {}).catch(()=>{});
      setPredictions({}); await supa.setState("predictions", {}).catch(()=>{});
      if (setEntryFees) { setEntryFees({}); await supa.setState("entry_fees", {}).catch(()=>{}); }
      toast_("✅ Bracket reset — ready for a new tournament");
      setConfirm("");
    } catch(e) { toast_("Reset failed: "+e.message, "error"); }
    setBusy(false);
  };
  return (
    <div>
      <p style={{fontSize:12, color:C.chalkDim, marginBottom:12, lineHeight:1.6}}>
        ⚠️ This clears the entire bracket, all results, all predictions, and entry fee records. Players and PINs are kept. Use this to start fresh for a future tournament.
      </p>
      <div style={{fontSize:11, color:C.chalkDim, marginBottom:6}}>Type RESET to confirm:</div>
      <input value={confirm} onChange={e=>setConfirm(e.target.value)} style={{...S.inp, textAlign:"center", letterSpacing:2}}/>
      <button disabled={busy||confirm.toUpperCase()!=="RESET"} onClick={doReset}
        style={{...S.btn, width:"100%", background:C.red, color:"#fff", opacity:(busy||confirm.toUpperCase()!=="RESET")?0.4:1}}>
        {busy?"Resetting…":"🔄 Reset Bracket"}
      </button>
    </div>
  );
}
